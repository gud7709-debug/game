function onData(d,c){if(d.t==='full'){U.net.textContent='This room is full (6 players).';return}if(d.t==='hello'){remote(d.id,d);if(isHost&&c?.open){c.send({t:'hello',id:pid,role,f:floor,x:C.position.x,y:C.position.y,z:C.position.z,r:yaw,jailed,crouch,running:!!sprinting});lobbySend()}}if(d.t==='lobbyJoin'&&isHost){let a=remote(c?.peer||d.id,d);a.role=d.role==='SEEKER'?'SEEKER':'HIDER';lobbySend()}if(d.t==='lobby'&&!isHost){let l=document.getElementById('lobby');if(l){l.querySelector('#lobbyPlayers').textContent=`참가자 ${d.players?.length||1}/6명 · 술래 ${d.seekerCount||1}명`;l.querySelector('#lobbyInfo').textContent='방장이 인원과 술래 수를 정한 뒤 시작합니다.'}}if(d.t==='start'&&!isHost){role=d.roles?.[pid]||'HIDER';rem.forEach(a=>a.role=d.roles?.[a.id]||a.role);let l=document.getElementById('lobby');if(l)l.style.display='none';roomLobby=0;start(role)}if(d.t==='captureReq'&&isHost){let a=rem.get(d.target);if(a)beginRemoteCarry(a,c?.peer||d.by)}if(d.t==='p'){let a=remote(d.id,d),np=new T.Vector3(d.x,d.y-eye,d.z);if(!a.carried){if(a.g.position.distanceTo(np)>.04&&a.f===floor)spatial(np,.08);a.g.position.copy(np);a.f=d.f;a.g.rotation.y=d.r}a.jailed=!!d.jailed;a.crouch=!!d.crouch;a.running=!!d.running;a.g.scale.y=a.crouch?.58:.92}if(d.t==='carry'){let a=remote(d.id,d);a.carried=1;a.carrier=d.carrier;if(d.carrier===pid&&d.id!==pid)carrying=a;if(d.id===pid){beingCarried=1;jailed=0;say('You were picked up · being carried to the 1F jail')}}if(d.t==='carryPos'){let a=remote(d.id,d);a.carried=1;a.f=d.f;a.g.position.set(d.ax,d.ay,d.az);a.g.rotation.y=d.r;if(isHost&&d.carrier!==pid)conns.forEach(x=>x.open&&x.send(d));if(d.id===pid){beingCarried=1;floor=d.f;C.position.set(d.x,d.y,d.z)}}if(d.t==='carryDrop'){let a=remote(d.id,d);a.carried=0;a.f=d.floor;a.g.position.set(d.x,d.floor*H,d.z);if(isHost&&c)conns.forEach(x=>x.open&&x.send(d));if(d.id===pid){beingCarried=0;floor=d.floor;C.position.set(d.x,d.floor*H+eye,d.z);say('Person put down')}}if(d.t==='jailReq'&&isHost){let a=rem.get(d.id);if(a){a.carried=0;a.jailed=1;a.f=0;a.g.position.set(jailPos[0],0,jailPos[2]);conns.forEach(x=>x.open&&x.send({t:'jail',id:a.id}));state()}}if(d.t==='jail'){if(d.id&&d.id!==pid){let a=remote(d.id,d);a.carried=0;a.jailed=1;a.f=0;a.g.position.set(jailPos[0],0,jailPos[2])}else{beingCarried=0;jailed=1;floor=0;crouch=0;C.position.set(...jailPos);C.rotation.set(0,0,0);say('Captured · you are in the first-floor jail.')}}if(d.t==='state'&&!isHost){left=d.left;d.ai.forEach((q,i)=>{let a=ais[i];if(!a)return;a.got=q.got;a.carried=!!q.carried;a.f=q.f;a.g.position.set(q.x,q.y,q.z)})}if(isHost&&d.t==='p')for(let x of conns)if(x!==c&&x.open)x.send(d)}
const baseOnData=onData;onData=(d,c)=>{if(d.t==='serverError')return U.net.textContent=d.message||'Game server error.';if(d.t==='roomClosed'){clean();return U.net.textContent='The host closed the room.'}if(d.t==='lobby'&&isHost){let l=document.getElementById('lobby');if(l)l.querySelector('#lobbyPlayers').textContent=`참가자 ${d.players?.length||1}/6명 · 술래 ${d.seekerCount||1}명`}if(d.t==='jailReq'&&isHost&&wsMode){let a=rem.get(d.id);if(a){a.carried=0;a.jailed=1;a.f=0;a.g.position.set(jailPos[0],0,jailPos[2]);sendRoom({t:'jail',id:a.id});state()}return}baseOnData(d,c)}
function useServer(){let h=location.hostname;return h!=='hanwha-taepyeongro-pixel-hunt-edupro13962-6488.vercel.app'||new URLSearchParams(location.search).has('server')}
function serverUrl(){let q=new URLSearchParams(location.search).get('server');if(q)return q.replace(/^http/,'ws').replace(/\/$/,'')+'/ws';return (location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws'}
function wsSend(d){if(ws?.readyState===1)ws.send(JSON.stringify(d))}
function connect(c){conns.push(c);c.on('open',()=>{c.send({t:'hello',id:pid,role,f:floor,x:C.position.x,y:C.position.y,z:C.position.z,r:yaw,jailed});if(isHost)for(let a of rem.values())c.send({t:'p',id:a.id,role:a.role,f:a.f,x:a.g.position.x,y:a.g.position.y+eye,z:a.g.position.z,r:a.g.rotation.y,jailed:a.jailed})});c.on('data',d=>onData(d,c));c.on('close',()=>{let a=rem.get(c.peer);if(a){S.remove(a.g);rem.delete(c.peer)}})}

function showLobby(hostFlag){roomLobby=1;let l=document.getElementById('lobby');if(!l){l=document.createElement('div');l.id='lobby';l.className='ui panel';l.style.cssText='inset:0;display:grid;place-items:center;background:#03060acc;z-index:20';l.innerHTML='<div class="panel" style="width:min(560px,92vw)"><h2>게임 대기실</h2><p id="lobbyInfo" class="muted"></p><label style="display:block;margin:10px 0">술래 수 <select id="seekerCount"><option value="1">1명</option><option value="2">2명</option><option value="3">3명</option><option value="4">4명</option><option value="5">5명</option></select></label><div class="row"><button id="roleSeeker">술래</button><button id="roleHider" class="main">숨는 사람</button></div><p id="lobbyPlayers" class="muted"></p><button id="lobbyStart" class="main">방장이 게임 시작</button></div>';document.body.appendChild(l);l.querySelector('#roleSeeker').onclick=()=>selectLobbyRole('SEEKER');l.querySelector('#roleHider').onclick=()=>selectLobbyRole('HIDER');l.querySelector('#seekerCount').onchange=e=>{if(isHost){seekerCount=Math.max(1,Math.min(5,+e.target.value||1));lobbySend()}};l.querySelector('#lobbyStart').onclick=beginRoom}l.style.display='grid';l.querySelector('#lobbyStart').style.display=hostFlag?'block':'none';l.querySelector('#seekerCount').style.display=hostFlag?'inline-block':'none';l.querySelector('#lobbyInfo').textContent=hostFlag?'방장입니다. 인원과 술래 수를 정한 뒤 시작하세요.':'방장이 정한 술래 수로 역할이 자동 배정됩니다.';l.querySelector('#roleSeeker').style.display=hostFlag?'none':'inline-block';lobbySend()}

function lobbySend(){if(!isHost)return;let players=[{id:pid,role:'SEEKER'}];rem.forEach(a=>players.push({id:a.id,role:a.role||'HIDER'}));let l=document.getElementById('lobby');if(l){l.querySelector('#lobbyPlayers').textContent=`참가자 ${players.length}/6명 · 술래 ${seekerCount}명`;let s=l.querySelector('#seekerCount');if(s)s.value=String(Math.min(seekerCount,players.length))}let d={t:'lobby',players,seekerCount,maxPlayers:6};if(wsMode)wsSend(d);else conns.forEach(c=>c.open&&c.send(d))}

function host(){if(useServer()){clean();isHost=1;role='SEEKER';let code=String(Math.floor(100000+Math.random()*900000));U.code.value=code;history.replaceState(null,'',`${location.pathname}?room=${code}`);wsMode=1;ws=new WebSocket(serverUrl());ws.onopen=()=>{pid=crypto.randomUUID?.()||('p-'+Math.random().toString(36).slice(2));wsSend({t:'create',code,id:pid});U.net.textContent=`Room ${code} created · share the link and code`;showLobby(true)};ws.onmessage=e=>{try{onData(JSON.parse(e.data),null)}catch{}};ws.onerror=()=>U.net.textContent='Game server connection error.';ws.onclose=()=>{if(!roomLobby&&!run)U.net.textContent='Game server disconnected.'};return}if(!Peer)return U.net.textContent='PeerJS failed to load.';clean();isHost=1;role='SEEKER';let code=String(Math.floor(100000+Math.random()*900000));U.code.value=code;history.replaceState(null,'',`${location.pathname}?room=${code}`);peer=new Peer('hp3-'+code);let timer=setTimeout(()=>{if(!run)U.net.textContent='Room creation timed out. Check your connection.'},12000);peer.on('open',id=>{clearTimeout(timer);pid=id;U.net.textContent=`Room ${code} created · share the link and code`;showLobby(true)});peer.on('connection',c=>{if(conns.length>=5){c.on('open',()=>c.send({t:'full'}));setTimeout(()=>c.close(),500);return}connect(c)});peer.on('error',e=>{clearTimeout(timer);U.net.textContent='Connection error: '+e.type})}
function join(){let code=U.code.value.trim();if(!/^\d{6}$/.test(code))return U.net.textContent='Enter a 6-digit room code.';if(useServer()){clean();role='HIDER';lobbyRole='HIDER';wsMode=1;ws=new WebSocket(serverUrl());ws.onopen=()=>{pid=crypto.randomUUID?.()||('p-'+Math.random().toString(36).slice(2));wsSend({t:'join',code,id:pid});U.net.textContent=`Joining room ${code}…`;showLobby(false);wsSend({t:'lobbyJoin',role:lobbyRole})};ws.onmessage=e=>{try{onData(JSON.parse(e.data),null)}catch{}};ws.onerror=()=>U.net.textContent='Game server connection error.';return}if(!Peer)return U.net.textContent='PeerJS failed to load.';clean();role='HIDER';lobbyRole='HIDER';peer=new Peer;let timer=setTimeout(()=>{if(!run)U.net.textContent='Connection timed out. Check the room code and network.'},12000);peer.on('open',id=>{pid=id;let c=peer.connect('hp3-'+code,{reliable:true});connect(c);let ct=setTimeout(()=>{if(!run)U.net.textContent='Host did not respond. Try again.'},10000);c.on('open',()=>{clearTimeout(timer);clearTimeout(ct);U.net.textContent=`Joined room ${code}`;showLobby(false);c.send({t:'lobbyJoin',role:lobbyRole})})});peer.on('error',e=>{clearTimeout(timer);U.net.textContent='Connection error: '+e.type})}
